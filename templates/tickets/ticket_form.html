{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="page-header"><h1 class="h3">{% if object %}Editar ticket{% else %}Crear ticket{% endif %}</h1></div>
<div class="panel">
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="row">{% bootstrap_form form layout='floating' %}</div>
    <div class="d-flex gap-2 mt-3"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" href="{% url 'tickets:list' %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
